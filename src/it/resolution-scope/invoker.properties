# Install the small graph before running the rules against its consumer.
invoker.goals = install
invoker.buildResult = success

# Scan filtering retains the provided winner during mediation, even without resolutionScope.
invoker.project.2 = app
invoker.goals.2 = enforcer:enforce
invoker.profiles.2 = scan-compile
invoker.buildResult.2 = success

# Compile resolution retains the provided winner until scanning
invoker.project.3 = app
invoker.goals.3 = enforcer:enforce
invoker.profiles.3 = compile,scan-compile
invoker.buildResult.3 = success

# An ignored scope only filters the mediated results
invoker.project.4 = app
invoker.goals.4 = enforcer:enforce
invoker.profiles.4 = compile,ignore-provided
invoker.buildResult.4 = success

# The complete compile classpath contains the provided API
invoker.project.5 = app
invoker.goals.5 = enforcer:enforce
invoker.profiles.5 = compile
invoker.buildResult.5 = failure

# MNG-8041: exclude the direct provided API before collecting the runtime graph.
invoker.project.6 = app
invoker.goals.6 = enforcer:enforce
invoker.profiles.6 = runtime
invoker.buildResult.6 = failure

# MNG-8041: exclude the direct test API before collecting the runtime graph.
invoker.project.7 = app
invoker.goals.7 = enforcer:enforce -Dapi.scope=test
invoker.profiles.7 = runtime
invoker.buildResult.7 = failure

# Test resolution allows the test dependency to win before scan filtering
invoker.project.8 = app
invoker.goals.8 = enforcer:enforce -Dapi.scope=test
invoker.profiles.8 = test,scan-compile
invoker.buildResult.8 = success

# An excluded direct-only artifact still participates in mediation
invoker.project.9 = app
invoker.goals.9 = enforcer:enforce -DsearchTransitive=false
invoker.profiles.9 = compile,scan-compile
invoker.buildResult.9 = success

# Direct-only runtime scanning does not scan the transitive API
invoker.project.10 = app
invoker.goals.10 = enforcer:enforce -DsearchTransitive=false
invoker.profiles.10 = runtime
invoker.buildResult.10 = success

# Optional dependencies can be excluded from scanning.
invoker.project.11 = app
invoker.goals.11 = enforcer:enforce -Dlib.optional=true
invoker.profiles.11 = runtime,ignore-optionals
invoker.buildResult.11 = success

# A runtime branch is absent from the compile classpath
invoker.project.12 = app
invoker.goals.12 = enforcer:enforce -Dlib.scope=runtime -Dapi.scope=test
invoker.profiles.12 = compile
invoker.buildResult.12 = success

# Unknown classpaths fail instead of silently scanning no artifacts
invoker.project.13 = app
invoker.goals.13 = enforcer:enforce
invoker.profiles.13 = invalid
invoker.buildResult.13 = failure

# Compile resolution excludes the direct test API but retains the nearer transitive runtime version.
invoker.project.14 = app
invoker.goals.14 = enforcer:enforce -Dapi.scope=test -Dlib.artifactId=indirect-lib
invoker.profiles.14 = compile,transitive-runtime
invoker.buildResult.14 = failure

# Runtime children of a provided dependency inherit provided scope on the compile classpath.
invoker.project.15 = app
invoker.goals.15 = enforcer:enforce -Dapi.scope=test -Dlib.artifactId=runtime-lib -Dlib.scope=provided
invoker.profiles.15 = compile
invoker.buildResult.15 = failure

# A runtime dependency managed into compile scope must be scanned.
invoker.project.16 = managed-app
invoker.goals.16 = enforcer:enforce
invoker.buildResult.16 = failure

# Runtime resolution with the same compile scan filter detects the same duplicate.
invoker.project.17 = managed-app
invoker.goals.17 = enforcer:enforce -Dresolution.scope=runtime
invoker.buildResult.17 = failure

# A compile dependency managed into runtime scope is excluded from the compile classpath.
invoker.project.18 = managed-app
invoker.goals.18 = enforcer:enforce -Dlib.artifactId=lib -Dmanaged.scope=runtime
invoker.buildResult.18 = success

# Scan the same API version Maven selected for its compile classpath.
# Only the discarded API version contains the duplicate RemovedApi class.
invoker.project.19 = mediated-app
invoker.goals.19 = org.apache.maven.plugins:maven-dependency-plugin:3.6.1:build-classpath -DincludeScope=compile -Dmdep.outputFile=target/compile-classpath.txt enforcer:enforce
invoker.buildResult.19 = success

# MNG-8041: exclude the direct test API before collecting the compile graph.
invoker.project.20 = app
invoker.goals.20 = enforcer:enforce -Dapi.scope=test
invoker.profiles.20 = compile
invoker.buildResult.20 = failure
