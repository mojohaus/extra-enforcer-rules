# MNG-8041: a direct test dependency must not hide a required runtime dependency.
invoker.goals = enforcer:enforce
invoker.buildResult = failure

# The same test dependency wins in a test graph and is then excluded from scanning.
invoker.goals.2 = enforcer:enforce -DresolutionScope=test
invoker.buildResult.2 = success

# The scan filter may further narrow the runtime classpath to exact runtime-scoped artifacts.
invoker.goals.3 = enforcer:enforce -Dscan.scope=runtime
invoker.buildResult.3 = success

# Scanning the test scope detects the selected version rather than the discarded compile version.
invoker.goals.4 = enforcer:enforce -DresolutionScope=test -Dscan.scope=test
invoker.buildResult.4 = failure

# A direct test dependency must not hide the transitive compile dependency either.
invoker.goals.5 = enforcer:enforce -DresolutionScope=compile
invoker.buildResult.5 = failure
