version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    exclude-paths:
      - "src/it/**"
    schedule:
      interval: "monthly"
    groups:
      maven:
        update-types: ["minor", "patch"]
    ignore:
      # ignore Maven Core updates
      - dependency-name: "org.apache.maven:*"
      # Mockito 5 requires Java 11; the build still runs on JDK 8
      - dependency-name: "org.mockito:*"
        versions: [">= 5.0.0"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
