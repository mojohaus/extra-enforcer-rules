version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    exclude-paths:
      - "src/it/**"
      - "src/it-repo/**"
      - "src/test/resources/**"
    schedule:
      interval: "monthly"
    groups:
      maven:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Stay on the Maven 3.9.x line
      - dependency-name: "org.apache.maven:maven-artifact"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-core"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-model"
        versions: [">= 3.10.0"]
      # Maven 3.9.x ships Resolver 1.9.x
      - dependency-name: "org.apache.maven.resolver:*"
        versions: [">= 2.0.0"]
      # Mockito 5 requires Java 11; the build still runs on JDK 8
      - dependency-name: "org.mockito:*"
        versions: [">= 5.0.0"]
      # localhost:* are IT fixtures served by the ITs' mock repository at fixed versions
      - dependency-name: "localhost:*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
